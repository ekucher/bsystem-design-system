name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      # Run on every build rather than only in the security workflow, so a
      # vulnerable dependency cannot be merged while waiting for a scheduled
      # scan.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type check
        run: npm run check
      # Behaviour and automated accessibility checks. The accessibility
      # assertions run axe over every component.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # A consumer-visible change without a changeset would be released with
      # no version bump and no changelog entry, so the absence is reported.
      - name: Check for a changeset
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^src/'; then
            if ! ls .changeset/*.md 2>/dev/null | grep -qv 'README.md'; then
              echo "::warning::This pull request changes src/ but adds no changeset. Run 'npx changeset' to describe the change for consumers."
            fi
          fi
